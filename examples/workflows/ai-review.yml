name: AI code review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ai-review-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check dispatch credential
        uses: actions/github-script@v8
        env:
          AGENT_DISPATCH_TOKEN: ${{ secrets.AGENT_DISPATCH_TOKEN }}
        with:
          script: |
            if (!process.env.AGENT_DISPATCH_TOKEN) {
              core.setFailed('Save AGENT_DISPATCH_TOKEN in repository Actions secrets with Actions: write on Flobsterable/cosplay-dev-assistant (fine-grained token). The repository GITHUB_TOKEN cannot dispatch across repositories.');
            }
      - name: Inspect changed source metadata
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const pull = context.payload.pull_request;
            if (!pull || pull.draft || pull.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.setOutput('changed', 'false');
              core.notice('Draft or external PR: review task was not dispatched.');
              return;
            }
            // Read metadata only; no application or PR code is executed.
            const supported = path => /\.(kt|kts|toml|properties|xml)$/.test(path || '') || /^\.github\/workflows\/[^/]+\.ya?ml$/.test(path || '');
            if (pull.changed_files <= 3000) {
              const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pull.number, per_page: 100 });
              if (!files.some(file => supported(file.filename) || supported(file.previous_filename))) {
                core.setOutput('changed', 'false');
                core.notice('No supported source changes; no review task needed.');
                return;
              }
            }
            core.setOutput('changed', 'true');
      - name: Send review task to the agent repository
        if: steps.source.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          script: |
            const pull = context.payload.pull_request;
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Flobsterable', repo: 'cosplay-dev-assistant', workflow_id: 'agent.yml', ref: 'main',
              inputs: { type: 'review', repository: context.repo.owner + '/' + context.repo.repo,
                base: pull.base.sha, head: pull.head.sha, pr: String(pull.number), branch: pull.base.ref }
            });
            core.notice('Review task sent. The agent repository tracks execution and publishes the result.');
