name: Update project documentation
on:
  push:
    branches: [develop, main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.toml'
      - 'gradle.properties'
      - '.github/workflows/release.yml'
      - '.github/workflows/docs-sync.yml'
      - '.github/scripts/docs-sync-status*.cjs'
      - '.github/scripts/docs-sync-run.sh'
      - '.github/scripts/agent-*.cjs'
  workflow_dispatch:
    inputs:
      base:
        description: 'Full base SHA before the merged change'
        required: true
      head:
        description: 'Full merged SHA to analyse'
        required: true
permissions:
  contents: read
concurrency:
  group: docs-sync-dispatch-${{ github.ref_name }}-${{ inputs.head || github.sha }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check dispatch credential
        uses: actions/github-script@v8
        env:
          AGENT_DISPATCH_TOKEN: ${{ secrets.AGENT_DISPATCH_TOKEN }}
        with:
          script: |
            if (!process.env.AGENT_DISPATCH_TOKEN) {
              core.setFailed('Save AGENT_DISPATCH_TOKEN in repository Actions secrets with Actions: write on Flobsterable/cosplay-dev-assistant (fine-grained token). The repository GITHUB_TOKEN cannot dispatch across repositories.');
            }
      - name: Send documentation task to the agent repository
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          script: |
            const inputs = context.payload.inputs || {};
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const base = inputs.base || context.payload.before;
            const head = inputs.head || context.sha;
            if (!['develop', 'main'].includes(branch) || !/^[a-f0-9]{40}$/.test(base || '') || !/^[a-f0-9]{40}$/.test(head || '')) {
              core.setFailed('Documentation dispatch requires develop/main and full base/head commit SHAs.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Flobsterable', repo: 'cosplay-dev-assistant', workflow_id: 'agent.yml', ref: 'main',
              inputs: { type: 'docs-sync', repository: context.repo.owner + '/' + context.repo.repo, base, head, branch }
            });
            core.notice('Documentation task sent. The agent repository tracks execution and recovery.');
